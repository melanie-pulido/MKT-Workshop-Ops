name: Delete Business Unit (one-off)

on:
  workflow_dispatch:
    inputs:
      bu_name:
        description: "Exact name of the Business Unit to delete"
        required: true
        type: string

jobs:
  delete-bu:
    runs-on: ubuntu-latest
    environment: sfmc-production
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Delete Business Unit
        env:
          SFMC_SUBDOMAIN: ${{ secrets.SFMC_SUBDOMAIN }}
          SFMC_CLIENT_ID: ${{ secrets.SFMC_CLIENT_ID }}
          SFMC_CLIENT_SECRET: ${{ secrets.SFMC_CLIENT_SECRET }}
          SFMC_PARENT_MID: ${{ vars.SFMC_PARENT_MID }}
          BU_NAME: ${{ inputs.bu_name }}
        run: npm run delete-bu
