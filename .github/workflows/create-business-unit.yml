name: Create Business Unit

on:
  workflow_dispatch:
    inputs:
      bu_name:
        description: "New Business Unit name (also used as the ExternalKey/CustomerKey)"
        required: true
        type: string
      admin_user_keys:
        description: "Comma-separated AccountUser CustomerKeys to grant admin access. Leave blank to use the default admin list (repo variable DEFAULT_ADMIN_USER_KEYS)."
        required: false
        type: string

jobs:
  create-business-unit:
    runs-on: ubuntu-latest
    environment: sfmc-production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Business Unit automation
        env:
          SFMC_SUBDOMAIN: ${{ secrets.SFMC_SUBDOMAIN }}
          SFMC_CLIENT_ID: ${{ secrets.SFMC_CLIENT_ID }}
          SFMC_CLIENT_SECRET: ${{ secrets.SFMC_CLIENT_SECRET }}
          SFMC_PARENT_MID: ${{ vars.SFMC_PARENT_MID }}
          NEST_UNDER_BU_MID: ${{ vars.NEST_UNDER_BU_MID }}
          BU_EMAIL: ${{ vars.BU_EMAIL }}
          BU_FROM_NAME: ${{ vars.BU_FROM_NAME }}
          COMPANY_NAME: ${{ vars.COMPANY_NAME }}
          COMPANY_ADDRESS: ${{ vars.COMPANY_ADDRESS }}
          COMPANY_CITY: ${{ vars.COMPANY_CITY }}
          COMPANY_STATE: ${{ vars.COMPANY_STATE }}
          COMPANY_ZIP: ${{ vars.COMPANY_ZIP }}
          COMPANY_COUNTRY: ${{ vars.COMPANY_COUNTRY }}
          LOG_DE_KEY: ${{ vars.LOG_DE_KEY }}
          DEFAULT_ADMIN_USER_KEYS: ${{ vars.DEFAULT_ADMIN_USER_KEYS }}
          BU_NAME: ${{ inputs.bu_name }}
          ADMIN_USER_KEYS: ${{ inputs.admin_user_keys }}
        run: npm run create-bu
