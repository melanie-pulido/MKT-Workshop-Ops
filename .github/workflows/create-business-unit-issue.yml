name: Create Business Unit (Issue Form)

on:
  issues:
    types: [labeled]

jobs:
  create-business-unit:
    if: contains(github.event.issue.labels.*.name, 'create-business-unit')
    runs-on: ubuntu-latest
    environment: sfmc-production
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Rename issue title with creation timestamp
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          CREATED_AT: ${{ github.event.issue.created_at }}
        run: |
          STAMP="$(TZ='America/Los_Angeles' date -d "$CREATED_AT" +"%m/%d/%Y %-I:%M%p PST")"
          gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --title "New Business Unit Creation - $STAMP"
          gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body "⏳ New Business Unit Creation in progress…"

      - name: Parse issue body
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: node scripts/parse-bu-issue-body.js

      - name: Route org credentials
        env:
          ORG: ${{ env.ORG }}
          MC_EVENTS_2_SUBDOMAIN:         ${{ secrets.MC_EVENTS_2_SUBDOMAIN }}
          MC_EVENTS_2_CLIENT_ID:         ${{ secrets.MC_EVENTS_2_CLIENT_ID }}
          MC_EVENTS_2_CLIENT_SECRET:     ${{ secrets.MC_EVENTS_2_CLIENT_SECRET }}
          MC_EVENTS_2_PARENT_MID:        ${{ vars.MC_EVENTS_2_PARENT_MID }}
          MC_EVENTS_2_NEST_UNDER_BU_MID: ${{ vars.MC_EVENTS_2_NEST_UNDER_BU_MID }}
          MC_EVENTS_2_BU_EMAIL:          ${{ vars.MC_EVENTS_2_BU_EMAIL }}
          MC_EVENTS_2_BU_FROM_NAME:      ${{ vars.MC_EVENTS_2_BU_FROM_NAME }}
          MC_EVENTS_2_COMPANY_NAME:      ${{ vars.MC_EVENTS_2_COMPANY_NAME }}
          MC_EVENTS_2_COMPANY_ADDRESS:   ${{ vars.MC_EVENTS_2_COMPANY_ADDRESS }}
          MC_EVENTS_2_COMPANY_CITY:      ${{ vars.MC_EVENTS_2_COMPANY_CITY }}
          MC_EVENTS_2_COMPANY_STATE:     ${{ vars.MC_EVENTS_2_COMPANY_STATE }}
          MC_EVENTS_2_COMPANY_ZIP:       ${{ vars.MC_EVENTS_2_COMPANY_ZIP }}
          MC_EVENTS_2_COMPANY_COUNTRY:   ${{ vars.MC_EVENTS_2_COMPANY_COUNTRY }}
          MC_EVENTS_2_LOG_DE_KEY:        ${{ vars.MC_EVENTS_2_LOG_DE_KEY }}
          MC_EVENTS_2_DEFAULT_ADMIN_USER_KEYS: ${{ vars.MC_EVENTS_2_DEFAULT_ADMIN_USER_KEYS }}
          MC_EVENTS_3_SUBDOMAIN:         ${{ secrets.MC_EVENTS_3_SUBDOMAIN }}
          MC_EVENTS_3_CLIENT_ID:         ${{ secrets.MC_EVENTS_3_CLIENT_ID }}
          MC_EVENTS_3_CLIENT_SECRET:     ${{ secrets.MC_EVENTS_3_CLIENT_SECRET }}
          MC_EVENTS_3_PARENT_MID:        ${{ vars.MC_EVENTS_3_PARENT_MID }}
          MC_EVENTS_3_NEST_UNDER_BU_MID: ${{ vars.MC_EVENTS_3_NEST_UNDER_BU_MID }}
          MC_EVENTS_3_BU_EMAIL:          ${{ vars.MC_EVENTS_3_BU_EMAIL }}
          MC_EVENTS_3_BU_FROM_NAME:      ${{ vars.MC_EVENTS_3_BU_FROM_NAME }}
          MC_EVENTS_3_COMPANY_NAME:      ${{ vars.MC_EVENTS_3_COMPANY_NAME }}
          MC_EVENTS_3_COMPANY_ADDRESS:   ${{ vars.MC_EVENTS_3_COMPANY_ADDRESS }}
          MC_EVENTS_3_COMPANY_CITY:      ${{ vars.MC_EVENTS_3_COMPANY_CITY }}
          MC_EVENTS_3_COMPANY_STATE:     ${{ vars.MC_EVENTS_3_COMPANY_STATE }}
          MC_EVENTS_3_COMPANY_ZIP:       ${{ vars.MC_EVENTS_3_COMPANY_ZIP }}
          MC_EVENTS_3_COMPANY_COUNTRY:   ${{ vars.MC_EVENTS_3_COMPANY_COUNTRY }}
          MC_EVENTS_3_LOG_DE_KEY:        ${{ vars.MC_EVENTS_3_LOG_DE_KEY }}
          MC_EVENTS_3_DEFAULT_ADMIN_USER_KEYS: ${{ vars.MC_EVENTS_3_DEFAULT_ADMIN_USER_KEYS }}
        run: |
          case "$ORG" in
            "MC Events 2 (MID 517032594)")
              {
                echo "SFMC_SUBDOMAIN=$MC_EVENTS_2_SUBDOMAIN"
                echo "SFMC_CLIENT_ID=$MC_EVENTS_2_CLIENT_ID"
                echo "SFMC_CLIENT_SECRET=$MC_EVENTS_2_CLIENT_SECRET"
                echo "SFMC_PARENT_MID=$MC_EVENTS_2_PARENT_MID"
                echo "NEST_UNDER_BU_MID=$MC_EVENTS_2_NEST_UNDER_BU_MID"
                echo "BU_EMAIL=$MC_EVENTS_2_BU_EMAIL"
                echo "BU_FROM_NAME=$MC_EVENTS_2_BU_FROM_NAME"
                echo "COMPANY_NAME=$MC_EVENTS_2_COMPANY_NAME"
                echo "COMPANY_ADDRESS=$MC_EVENTS_2_COMPANY_ADDRESS"
                echo "COMPANY_CITY=$MC_EVENTS_2_COMPANY_CITY"
                echo "COMPANY_STATE=$MC_EVENTS_2_COMPANY_STATE"
                echo "COMPANY_ZIP=$MC_EVENTS_2_COMPANY_ZIP"
                echo "COMPANY_COUNTRY=$MC_EVENTS_2_COMPANY_COUNTRY"
                echo "LOG_DE_KEY=$MC_EVENTS_2_LOG_DE_KEY"
                echo "DEFAULT_ADMIN_USER_KEYS=$MC_EVENTS_2_DEFAULT_ADMIN_USER_KEYS"
              } >> "$GITHUB_ENV"
              ;;
            "MC Events 3 (MID 517035532)")
              {
                echo "SFMC_SUBDOMAIN=$MC_EVENTS_3_SUBDOMAIN"
                echo "SFMC_CLIENT_ID=$MC_EVENTS_3_CLIENT_ID"
                echo "SFMC_CLIENT_SECRET=$MC_EVENTS_3_CLIENT_SECRET"
                echo "SFMC_PARENT_MID=$MC_EVENTS_3_PARENT_MID"
                echo "NEST_UNDER_BU_MID=$MC_EVENTS_3_NEST_UNDER_BU_MID"
                echo "BU_EMAIL=$MC_EVENTS_3_BU_EMAIL"
                echo "BU_FROM_NAME=$MC_EVENTS_3_BU_FROM_NAME"
                echo "COMPANY_NAME=$MC_EVENTS_3_COMPANY_NAME"
                echo "COMPANY_ADDRESS=$MC_EVENTS_3_COMPANY_ADDRESS"
                echo "COMPANY_CITY=$MC_EVENTS_3_COMPANY_CITY"
                echo "COMPANY_STATE=$MC_EVENTS_3_COMPANY_STATE"
                echo "COMPANY_ZIP=$MC_EVENTS_3_COMPANY_ZIP"
                echo "COMPANY_COUNTRY=$MC_EVENTS_3_COMPANY_COUNTRY"
                echo "LOG_DE_KEY=$MC_EVENTS_3_LOG_DE_KEY"
                echo "DEFAULT_ADMIN_USER_KEYS=$MC_EVENTS_3_DEFAULT_ADMIN_USER_KEYS"
              } >> "$GITHUB_ENV"
              ;;
            *)
              echo "❌ Unknown org: $ORG" >&2
              exit 1
              ;;
          esac
          echo "Routed credentials for: $ORG"

      - name: Run Create Business Unit automation
        id: run_automation
        continue-on-error: true
        env:
          # All credentials come from GITHUB_ENV via the routing step above.
          # BU_NAME comes from GITHUB_ENV via the parse step above.
          PLACEHOLDER: ""
        run: npm run create-bu

      - name: Post results as an issue comment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          if [ -s /tmp/create-bu-report.md ]; then
            cat /tmp/create-bu-report.md > /tmp/comment-body.md
          else
            echo "_(No report generated — the automation step may have failed before producing output.)_" > /tmp/comment-body.md
          fi
          gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body-file /tmp/comment-body.md

      - name: Close issue on success
        if: steps.run_automation.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: gh issue close "$ISSUE_NUMBER" --repo "$REPO" --reason completed

      - name: Fail the job if the automation failed
        if: steps.run_automation.outcome != 'success'
        run: exit 1
