name: Create Instructor User (Issue Form)

# Fires when the create-instructor-user label is applied to an issue.
# The issue template auto-applies this label on submission, so this fires
# exactly once per submission. labeled-only (not opened) avoids the
# double-trigger race where both events fire simultaneously.
on:
  issues:
    types: [labeled]

jobs:
  create-instructor-user:
    if: contains(github.event.issue.labels.*.name, 'create-instructor-user')
    runs-on: ubuntu-latest
    environment: sfmc-production
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Rename issue title with creation timestamp
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          CREATED_AT: ${{ github.event.issue.created_at }}
        run: |
          STAMP="$(date -u -d "$CREATED_AT" +"%m/%d/%Y %-I:%M%p UTC")"
          gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --title "New Instructor User Creation - $STAMP"
          gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body "⏳ New Instructor User Creation in progress…"

      - name: Parse issue body
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: node scripts/parse-instructor-issue-body.js

      - name: Route org credentials into SFMC_SUBDOMAIN / SFMC_CLIENT_ID / etc.
        # Reads INSTRUCTOR_ORG (written by the parse step) and writes the
        # matching org's credentials into GITHUB_ENV under the generic names
        # the script expects. All org credentials are mapped in below so this
        # step can select between them with plain shell — no secrets are ever
        # printed; they're only written to GITHUB_ENV (which GitHub masks).
        env:
          INSTRUCTOR_ORG: ${{ env.INSTRUCTOR_ORG }}
          MC_EVENTS_2_SUBDOMAIN:        ${{ secrets.MC_EVENTS_2_SUBDOMAIN }}
          MC_EVENTS_2_CLIENT_ID:        ${{ secrets.MC_EVENTS_2_CLIENT_ID }}
          MC_EVENTS_2_CLIENT_SECRET:    ${{ secrets.MC_EVENTS_2_CLIENT_SECRET }}
          MC_EVENTS_2_PARENT_MID:       ${{ vars.MC_EVENTS_2_PARENT_MID }}
          MC_EVENTS_2_ROLE_ID:          ${{ vars.MC_EVENTS_2_INSTRUCTOR_ROLE_ID }}
          MC_EVENTS_2_BU_NAME:          ${{ vars.MC_EVENTS_2_INSTRUCTOR_BU_NAME }}
          MC_EVENTS_2_LOG_DE_KEY:       ${{ vars.MC_EVENTS_2_LOG_DE_KEY_CREATE_USERS }}
          MC_EVENTS_3_SUBDOMAIN:        ${{ secrets.MC_EVENTS_3_SUBDOMAIN }}
          MC_EVENTS_3_CLIENT_ID:        ${{ secrets.MC_EVENTS_3_CLIENT_ID }}
          MC_EVENTS_3_CLIENT_SECRET:    ${{ secrets.MC_EVENTS_3_CLIENT_SECRET }}
          MC_EVENTS_3_PARENT_MID:       ${{ vars.MC_EVENTS_3_PARENT_MID }}
          MC_EVENTS_3_ROLE_ID:          ${{ vars.MC_EVENTS_3_INSTRUCTOR_ROLE_ID }}
          MC_EVENTS_3_BU_NAME:          ${{ vars.MC_EVENTS_3_INSTRUCTOR_BU_NAME }}
          MC_EVENTS_3_LOG_DE_KEY:       ${{ vars.MC_EVENTS_3_LOG_DE_KEY_CREATE_USERS }}
        run: |
          case "$INSTRUCTOR_ORG" in
            "MC Events 2 (MID 517022562)")
              {
                echo "SFMC_SUBDOMAIN=$MC_EVENTS_2_SUBDOMAIN"
                echo "SFMC_CLIENT_ID=$MC_EVENTS_2_CLIENT_ID"
                echo "SFMC_CLIENT_SECRET=$MC_EVENTS_2_CLIENT_SECRET"
                echo "SFMC_PARENT_MID=$MC_EVENTS_2_PARENT_MID"
                echo "INSTRUCTOR_USER_ROLE_ID=$MC_EVENTS_2_ROLE_ID"
                echo "INSTRUCTOR_BU_NAME=$MC_EVENTS_2_BU_NAME"
                echo "LOG_DE_KEY_CREATE_USERS=$MC_EVENTS_2_LOG_DE_KEY"
              } >> "$GITHUB_ENV"
              ;;
            "MC Events 3 (MID 517035532)")
              {
                echo "SFMC_SUBDOMAIN=$MC_EVENTS_3_SUBDOMAIN"
                echo "SFMC_CLIENT_ID=$MC_EVENTS_3_CLIENT_ID"
                echo "SFMC_CLIENT_SECRET=$MC_EVENTS_3_CLIENT_SECRET"
                echo "SFMC_PARENT_MID=$MC_EVENTS_3_PARENT_MID"
                echo "INSTRUCTOR_USER_ROLE_ID=$MC_EVENTS_3_ROLE_ID"
                echo "INSTRUCTOR_BU_NAME=$MC_EVENTS_3_BU_NAME"
                echo "LOG_DE_KEY_CREATE_USERS=$MC_EVENTS_3_LOG_DE_KEY"
              } >> "$GITHUB_ENV"
              ;;
            *)
              echo "❌ Unknown org: $INSTRUCTOR_ORG" >&2
              exit 1
              ;;
          esac
          echo "Routed credentials for: $INSTRUCTOR_ORG"

      - name: Run Create Instructor User automation
        id: run_automation
        continue-on-error: true
        env:
          INSTRUCTOR_USER_PASSWORD: ${{ secrets.INSTRUCTOR_USER_PASSWORD }}
          # All other credentials (SFMC_SUBDOMAIN, SFMC_CLIENT_ID, etc.)
          # come from GITHUB_ENV, written by the routing step above.
          # INSTRUCTOR_NAME, INSTRUCTOR_USERNAME, INSTRUCTOR_EMAIL come from
          # GITHUB_ENV, written by the parse step.
        run: npm run create-instructor-user

      - name: Post results as an issue comment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          if [ -s /tmp/create-instructor-report.md ]; then
            cat /tmp/create-instructor-report.md > /tmp/comment-body.md
          else
            echo "_(No report generated — the automation step may have failed before producing output.)_" > /tmp/comment-body.md
          fi
          gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body-file /tmp/comment-body.md

      - name: Close issue on success
        if: steps.run_automation.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: gh issue close "$ISSUE_NUMBER" --repo "$REPO" --reason completed

      - name: Fail the job if the automation failed
        if: steps.run_automation.outcome != 'success'
        run: exit 1
