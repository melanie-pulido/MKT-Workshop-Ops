name: Create Users (Issue Form)

# Fires when a "Create Users" issue (see .github/ISSUE_TEMPLATE/create-users.yml)
# is opened. Exists alongside the workflow_dispatch trigger in
# create-users.yml because the Actions "Run workflow" web form only gives
# a single-line box for text inputs — pasting multiple spreadsheet rows
# into it collapses them onto one line. Issue Forms render a real
# multi-line textarea, so this is the reliable path for the multi-user
# paste. Both triggers run the exact same scripts/create-users.js.
on:
  issues:
    types: [labeled]

jobs:
  create-users:
    if: contains(github.event.issue.labels.*.name, 'create-users')
    runs-on: ubuntu-latest
    environment: sfmc-production
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Rename issue title with creation timestamp
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          CREATED_AT: ${{ github.event.issue.created_at }}
        run: |
          # github.event.issue.created_at is always UTC (ISO 8601). Formatted
          # as e.g. "New User Creation - 08/10/2026 6:57PM UTC" -- GitHub
          # Issue Forms can't pre-fill a live timestamp into the title field
          # itself (title: is static text in the template), so this renames
          # the issue right after creation instead, using the real
          # server-recorded creation time rather than the submitter's local
          # clock (which could be wrong/spoofed).
          STAMP="$(date -u -d "$CREATED_AT" +"%m/%d/%Y %-I:%M%p UTC")"
          gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --title "New User Creation - $STAMP"
          gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body "⏳ New User Creation in progress…"

      - name: Parse issue body into TARGET_BU_NAME / USER_LIST
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: node scripts/parse-issue-body.js

      - name: Run Create Users automation
        id: run_automation
        continue-on-error: true
        env:
          SFMC_SUBDOMAIN: ${{ secrets.SFMC_SUBDOMAIN }}
          SFMC_CLIENT_ID: ${{ secrets.SFMC_CLIENT_ID }}
          SFMC_CLIENT_SECRET: ${{ secrets.SFMC_CLIENT_SECRET }}
          DEFAULT_USER_PASSWORD: ${{ secrets.DEFAULT_USER_PASSWORD }}
          SFMC_PARENT_MID: ${{ vars.SFMC_PARENT_MID }}
          DEFAULT_USER_ROLE_ID: ${{ vars.DEFAULT_USER_ROLE_ID }}
          DEFAULT_USER_EMAIL: ${{ vars.DEFAULT_USER_EMAIL }}
          LOG_DE_KEY: ${{ vars.LOG_DE_KEY_CREATE_USERS }}
          # TARGET_BU_NAME and USER_LIST come from GITHUB_ENV, written by
          # the parse step above — no need to map them here.
        run: npm run create-users

      - name: Post results as an issue comment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          # GITHUB_STEP_SUMMARY is scoped per-step; the script writes
          # an identical copy to /tmp/create-users-report.md so we can
          # read it here across step boundaries.
          if [ -s /tmp/create-users-report.md ]; then
            cat /tmp/create-users-report.md > /tmp/comment-body.md
          else
            echo "_(No report generated — the automation step may have failed before producing output.)_" > /tmp/comment-body.md
          fi
          gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body-file /tmp/comment-body.md

      - name: Close issue on success
        if: steps.run_automation.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: gh issue close "$ISSUE_NUMBER" --repo "$REPO" --reason completed

      - name: Fail the job if the automation failed
        if: steps.run_automation.outcome != 'success'
        run: exit 1
